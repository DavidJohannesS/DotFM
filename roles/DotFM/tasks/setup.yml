---
- name: Ensure CONFIG dir exists
  ansible.builtin.file:
    path: "{{ config_base_path }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Check if repo dir exists
  ansible.builtin.stat:
    path: "{{ config_base_path }}/{{ item.name }}/.git"
  register: repo_dir
  with_items: "{{ repos }}"

- name: Clone repositories
  ansible.builtin.git:
    repo: "{{ item.repo_url }}"
    dest: "{{ config_base_path }}/{{ item.name }}"
    remote: "{{ item.git_remote }}"
    version: "{{ git_branch }}"
    update: true
  when: not repo_dir.results[item_index].stat.exists
  with_items: "{{ repos }}"
  loop_control:
    index_var: item_index
    label: "{{ config_base_path }}/{{ item.name }}"
  tags: skip_ansible_lint

- name: Ensure Item's config directory exists
  ansible.builtin.file:
    path: "{{ item.config_item_path }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
    recurse: true
  loop: "{{ repos }}"
  loop_control:
    label: "{{ item.config_item_path }}"
  become: true
  when: item.config_item_path is defined and item.config_item_path != ""
